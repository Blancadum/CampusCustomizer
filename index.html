<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <title>Campus Global · Portal de Aprendizaje</title>
    <meta name="description" content="Campus Global · Plataforma integral de gestión de entregas, lecciones interactivas, podcasts formativos y recursos técnicos de desarrollo de software." />
    
    <!-- Favicon SVG moderno -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>" />
    
    <!-- Soporte PWA / Web App en macOS, iOS y Android -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Campus Global" />
    
    <!-- Barra de estado y tema dinámico adaptado a claro / oscuro -->
    <meta name="theme-color" content="#f6f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0a0e17" media="(prefers-color-scheme: dark)" />
    <meta name="color-scheme" content="light dark" />

    <!-- Tema antes de pintar (sin destello blanco). Misma lógica que src/utils/theme.js -->
    <script>
      (function () {
        var pref = 'light';
        try { pref = localStorage.getItem('micampus_theme') || 'light'; } catch (e) {}
        var dark = pref === 'dark' || (pref === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        var theme = dark ? 'dark' : 'light';
        if (theme === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
        document.documentElement.style.colorScheme = theme;
      })();
    </script>

    <!-- Open Graph (Metadata para vista previa al compartir) -->
    <meta property="og:title" content="Campus Global · Portal de Aprendizaje" />
    <meta property="og:description" content="Supervisa tus entregas, accede a tus pilares de contenido con navegación lateral y mantén tus asignaturas sincronizadas." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_ES" />

    <!-- Google Fonts optimizado con Preconnect: Plus Jakarta Sans + JetBrains Mono + Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" 
      rel="stylesheet" 
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
