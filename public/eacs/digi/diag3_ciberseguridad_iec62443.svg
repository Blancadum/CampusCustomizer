<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#0f172a; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradHeaderDigi3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="cardGradDigi3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadowDigi3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Background Grid Canvas -->
  <rect width="1200" height="675" fill="#0b0f19"/>
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <path d="M0 75 H1200 M0 150 H1200 M0 225 H1200 M0 300 H1200 M0 375 H1200 M0 450 H1200 M0 525 H1200 M0 600 H1200"/>
    <path d="M100 0 V675 M200 0 V675 M300 0 V675 M400 0 V675 M500 0 V675 M600 0 V675 M700 0 V675 M800 0 V675 M900 0 V675 M1000 0 V675 M1100 0 V675"/>
  </g>

  <!-- Top Banner / Header -->
  <rect x="50" y="35" width="1100" height="90" rx="16" fill="url(#cardGradDigi3)" stroke="#ef4444" stroke-width="2" filter="url(#shadowDigi3)"/>
  <circle cx="95" cy="80" r="24" fill="url(#gradHeaderDigi3)"/>
  <text x="95" y="87" font-size="22" font-weight="900" fill="#ffffff" text-anchor="middle">3</text>
  <text x="135" y="72" font-size="22" font-weight="800" fill="#f8fafc">TEMA 3: CIBERSEGURIDAD Y RESILIENCIA INDUSTRIAL</text>
  <text x="135" y="98" font-size="14" font-weight="500" fill="#fca5a5">Convergencia IT vs OT | Segmentación de Redes ISA/IEC 62443 | Modelo Purdue</text>

  <!-- Left: Convergencia IT vs OT -->
  <g transform="translate(50, 150)">
    <rect width="500" height="475" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadowDigi3)"/>
    <rect width="500" height="48" rx="16" fill="#ef4444" fill-opacity="0.2"/>
    <text x="24" y="32" font-size="15" font-weight="800" fill="#fca5a5">⚔️ CHOQUE DE CULTURAS: IT VS OT</text>

    <!-- IT Box -->
    <g transform="translate(20, 65)">
      <rect width="460" height="175" rx="12" fill="#0f172a" stroke="#0284c7" stroke-width="1.5"/>
      <rect width="460" height="30" rx="12" fill="#0284c7" fill-opacity="0.25"/>
      <text x="16" y="21" font-size="13" font-weight="800" fill="#38bdf8">REDES IT (INFORMATION TECHNOLOGY - OFICINA)</text>
      <text x="16" y="55" font-size="12" fill="#cbd5e1">• Prioridad: C-I-A (Confidencialidad &gt; Integridad &gt; Disponibilidad).</text>
      <text x="16" y="80" font-size="12" fill="#cbd5e1">• Tolerancia a reinicios y paradas por parches de seguridad.</text>
      <text x="16" y="105" font-size="12" fill="#cbd5e1">• Activos: Servidores corporativos, CRM, ERP, correo electrónico.</text>
      <text x="16" y="130" font-size="12" fill="#94a3b8">Impacto de fallo: Económico, filtración de datos, descrédito de marca.</text>
    </g>

    <!-- OT Box -->
    <g transform="translate(20, 260)">
      <rect width="460" height="190" rx="12" fill="#0f172a" stroke="#ef4444" stroke-width="1.5"/>
      <rect width="460" height="30" rx="12" fill="#ef4444" fill-opacity="0.25"/>
      <text x="16" y="21" font-size="13" font-weight="800" fill="#f87171">REDES OT (OPERATIONAL TECHNOLOGY - PLANTA INDUSTRIAL)</text>
      <text x="16" y="55" font-size="12" fill="#cbd5e1">• Prioridad: A-I-C (Disponibilidad 99.999% &gt; Integridad &gt; Confidencialidad).</text>
      <text x="16" y="80" font-size="12" fill="#cbd5e1">• Tolerancia cero a caídas: Un reinicio descontrolado rompe la línea.</text>
      <text x="16" y="105" font-size="12" fill="#cbd5e1">• Activos: SCADA, PLCs, brazos robóticos, turbinas, sensores de gas.</text>
      <rect x="16" y="125" width="428" height="40" rx="8" fill="#450a0a" stroke="#b91c1c" stroke-width="1"/>
      <text x="230" y="150" font-size="11" font-weight="700" fill="#fca5a5" text-anchor="middle">⚠️ Riesgo de fallo en OT: Daño físico humano, explosión o fuga tóxica</text>
    </g>
  </g>

  <!-- Right: Modelo Purdue & Norma ISA/IEC 62443 -->
  <g transform="translate(580, 150)">
    <rect width="570" height="475" rx="16" fill="#1e293b" stroke="#334155" stroke-width="1.5" filter="url(#shadowDigi3)"/>
    <rect width="570" height="48" rx="16" fill="#15803d" fill-opacity="0.2"/>
    <text x="24" y="32" font-size="15" font-weight="800" fill="#4ade80">🛡️ DEFENSA EN PROFUNDIDAD (NORMA ISA/IEC 62443)</text>

    <!-- Purdue Levels -->
    <g transform="translate(20, 65)">
      <!-- Level 4-5 -->
      <rect x="0" y="0" width="530" height="60" rx="8" fill="#0f172a" stroke="#0284c7" stroke-width="1"/>
      <text x="16" y="25" font-size="12" font-weight="800" fill="#38bdf8">Nivel 4 / 5 · Red Empresarial y Cloud Corporativo</text>
      <text x="16" y="45" font-size="11" fill="#94a3b8">ERP, bases de datos comerciales, navegación web general e internet.</text>

      <!-- DMZ Industrial -->
      <rect x="0" y="70" width="530" height="55" rx="8" fill="#78350f" fill-opacity="0.3" stroke="#f59e0b" stroke-width="1.5"/>
      <text x="16" y="93" font-size="12" font-weight="800" fill="#fbbf24">Nivel 3.5 · DMZ Industrial (Firewalls y Pasarelas de Datos)</text>
      <text x="16" y="112" font-size="11" fill="#fde68a">Aislamiento estricto: Ningún paquete IP viaja directamente de Nivel 4 a Nivel 2.</text>

      <!-- Level 3 -->
      <rect x="0" y="135" width="530" height="60" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="1"/>
      <text x="16" y="160" font-size="12" font-weight="800" fill="#c084fc">Nivel 3 · Operaciones y Supervisión SCADA / Historiador</text>
      <text x="16" y="180" font-size="11" fill="#94a3b8">Consolas de control de planta, monitorización pasiva de anomalías Modbus.</text>

      <!-- Level 1-2 -->
      <rect x="0" y="205" width="530" height="60" rx="8" fill="#0f172a" stroke="#22c55e" stroke-width="1"/>
      <text x="16" y="230" font-size="12" font-weight="800" fill="#4ade80">Nivel 1 / 2 · Control Básico (PLCs, RTUs, DCS)</text>
      <text x="16" y="250" font-size="11" fill="#94a3b8">Lógica de ejecución en tiempo real, lazos de control cerrados PID.</text>

      <!-- Level 0 -->
      <rect x="0" y="275" width="530" height="55" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="1"/>
      <text x="16" y="298" font-size="12" font-weight="800" fill="#e2e8f0">Nivel 0 · Proceso Físico (Sensores y Actuadores)</text>
      <text x="16" y="318" font-size="11" fill="#94a3b8">Instrumentación de campo: válvulas, motores, sensores térmicos.</text>
    </g>

    <!-- Bottom summary banner -->
    <rect x="20" y="415" width="530" height="40" rx="8" fill="#064e3b" stroke="#059669" stroke-width="1"/>
    <text x="285" y="440" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">Evaluación: 10.0% AC · Cuestionario Quiz EAC1 (P1) Superado</text>
  </g>
</svg>
